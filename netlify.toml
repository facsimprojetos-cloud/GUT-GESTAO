# Netlify publica só a pasta site/ (o resto do repositório fica privado)
[build]
  publish = "site"
  command = ""
  # v4.14.2: a publicação passou para o GitHub Pages; o Netlify não gasta mais publicações (fica com a última versão)
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# app de campo: /campo/<codigo-da-empresa> abre sempre o mesmo app
[[redirects]]
  from = "/campo/*"
  to = "/campo/index.html"
  status = 200
