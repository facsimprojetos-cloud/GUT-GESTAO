<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GUT Campo</title>
<link rel="manifest" id="mf" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1e1b4b">
<style>
  :root{
    --bg:#f4f6fb;--card:#ffffff;--ink:#0b1220;--ink2:#334155;--muted:#6b7a90;
    --line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.14);
    --pri:#4f46e5;--pri2:#7c3aed;--navy:#1e1b4b;
    --ok:#059669;--ok2:#10b981;--okbg:#ecfdf5;--info:#2563eb;--info2:#4f46e5;--infobg:#eef2ff;
    --warn:#d97706;--warn2:#f59e0b;--warnbg:#fffbeb;--bad:#dc2626;--bad2:#f43f5e;--badbg:#fff1f2;
    --r:18px;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px -8px rgba(15,23,42,.12);
    --sh2:0 2px 6px rgba(15,23,42,.06),0 18px 40px -16px rgba(30,27,75,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(1200px 500px at 100% -10%,rgba(124,58,237,.10),transparent 60%),radial-gradient(900px 420px at -10% 0%,rgba(37,99,235,.10),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:720px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}

  /* barra do topo */
  .top{position:sticky;top:0;z-index:5;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px;
    background:linear-gradient(135deg,#1e1b4b 0%,#312e81 55%,#4c1d95 100%);box-shadow:0 10px 30px -14px rgba(30,27,75,.7);border-bottom:1px solid rgba(255,255,255,.08)}
  .top .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.3px;color:#fff;
    background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .top h1{font-size:16px;font-weight:700;margin:0;line-height:1.15;letter-spacing:-.1px}.top small{display:block;opacity:.72;font-size:12px;font-weight:500}
  .top .sp{flex:1}
  .top button{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 13px;font-weight:600;font-size:14px;backdrop-filter:blur(6px);transition:background .15s}
  .top button:active{background:rgba(255,255,255,.22)}

  /* cartões */
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin:12px 0;box-shadow:var(--sh)}
  .card.op{padding-left:19px;overflow:hidden}
  .card.op::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#c7d2fe,#e0e7ff)}
  .card.op.mine::before{background:linear-gradient(180deg,var(--pri),var(--pri2))}
  .card.op.nostd::before{background:linear-gradient(180deg,var(--bad2),var(--bad))}

  /* login */
  .login{max-width:400px;margin:9vh auto 0;padding:26px 22px 22px;border-radius:24px;box-shadow:var(--sh2);
    background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.9));border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(10px)}
  .brandmark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
    background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 10px 22px -8px rgba(79,70,229,.6),inset 0 1px 0 rgba(255,255,255,.3)}
  .login h2{margin:0 0 2px;font-size:22px;font-weight:800;letter-spacing:-.4px}
  .hint{color:var(--muted);font-size:13px}
  .seg,.modeseg{display:grid;grid-template-columns:1fr 1fr;background:#eef1f7;border:1px solid var(--line);border-radius:14px;padding:4px;margin:16px 0 6px}
  .seg button,.modeseg button{border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:700;color:var(--ink2);font-size:14px;transition:all .18s}
  .seg button.on,.modeseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08),0 4px 12px -6px rgba(79,70,229,.35);outline:1px solid rgba(79,70,229,.18)}
  .modeseg{margin:12px 0 4px}
  .modeseg small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:1px}
  label{display:block;font-weight:600;font-size:13px;color:var(--ink2);margin:14px 0 6px}
  input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line2);border-radius:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:#9aa6b8}
  input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.14)}

  /* botões */
  .btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:#fff;
    transition:transform .08s ease,box-shadow .15s,filter .15s;box-shadow:0 1px 0 rgba(255,255,255,.25) inset}
  .btn:active{transform:scale(.97)}
  .btn.full{width:100%;margin-top:18px;padding:15px}
  .btn.dark{background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 10px 22px -10px rgba(79,70,229,.75),inset 0 1px 0 rgba(255,255,255,.25)}
  .btn.go{background:linear-gradient(135deg,#3b82f6,var(--info2));box-shadow:0 8px 18px -10px rgba(37,99,235,.8),inset 0 1px 0 rgba(255,255,255,.25)}
  .btn.ok{background:linear-gradient(135deg,var(--ok2),var(--ok));box-shadow:0 8px 18px -10px rgba(5,150,105,.8),inset 0 1px 0 rgba(255,255,255,.25)}
  .btn.stop{background:linear-gradient(135deg,var(--bad2),var(--bad));box-shadow:0 8px 18px -10px rgba(220,38,38,.8),inset 0 1px 0 rgba(255,255,255,.25)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2);box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .err{color:var(--bad);font-weight:600;font-size:14px;margin-top:10px;min-height:20px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}

  /* etiquetas */
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:#f1f5f9;color:var(--ink2);border:1px solid var(--line)}
  .chip.ok{background:var(--okbg);color:#065f46;border-color:rgba(5,150,105,.2)}
  .chip.info{background:var(--infobg);color:#3730a3;border-color:rgba(79,70,229,.2)}
  .chip.warn{background:var(--warnbg);color:#92400e;border-color:rgba(217,119,6,.22)}
  .chip.bad{background:var(--badbg);color:#9f1239;border-color:rgba(225,29,72,.2)}
  .ttl{font-size:16.5px;font-weight:700;margin:0;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:13px}.sub b{color:var(--ink2)}
  .ord{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;margin-right:6px;border-radius:7px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:700;vertical-align:2px;font-variant-numeric:tabular-nums}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}

  /* estados: em andamento / pausado / líder (borda em degradê) */
  .running,.card.paused{border:1.5px solid transparent;background-origin:border-box;background-clip:padding-box,border-box}
  .running{background-image:linear-gradient(180deg,#f5f7ff,#fff),linear-gradient(135deg,#3b82f6,#7c3aed);box-shadow:0 16px 36px -18px rgba(79,70,229,.55)}
  .card.paused{background-image:linear-gradient(180deg,#fffaf0,#fff),linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 14px 30px -18px rgba(217,119,6,.5)}
  .card.lider{border:1px dashed rgba(79,70,229,.35);background:linear-gradient(135deg,rgba(238,242,255,.9),rgba(250,245,255,.9))}
  .running .chip.info::before{content:"";width:7px;height:7px;border-radius:50%;background:#2563eb;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
  .timer.small{font-size:22px;background:linear-gradient(135deg,#b45309,#ea580c);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* progresso do dia */
  .prog{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffffff,#f8f9ff);border:1px solid var(--line);border-radius:20px;padding:15px 16px;margin-top:10px;box-shadow:var(--sh)}
  .prog::after{content:"";position:absolute;right:-60px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.12),transparent 70%)}
  .prog .big{font-size:28px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .prog .bar{height:10px;border-radius:99px;background:#e9edf5;overflow:hidden;margin:10px 0 6px;box-shadow:inset 0 1px 2px rgba(15,23,42,.08)}
  .prog .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#059669);transition:width .5s ease}
  .prog .bar i.low{background:linear-gradient(90deg,#fbbf24,#f97316)}.prog .bar i.over{background:linear-gradient(90deg,#10b981,#0d9488,#4f46e5)}
  .acts{display:flex;gap:8px;margin-top:13px}.acts .btn{flex:1}

  /* facção: caixas */
  .boxes{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
  .box{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.box:last-child{border:0}
  .box .info{flex:1;min-width:0}.box .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:13px}
  .box .btn{padding:9px 12px;font-size:13px;border-radius:12px}
  .link{background:none;border:0;color:var(--pri);font-weight:600;padding:10px 0 2px;font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:34px 14px;border-style:dashed;background:rgba(255,255,255,.7)}

  /* busca */
  .search{position:relative}.search input{padding-left:42px;padding-right:66px;border-radius:16px;box-shadow:var(--sh)}
  .search span{position:absolute;left:14px;top:13px;opacity:.55}
  .search .cam{position:absolute;right:6px;top:6px;bottom:6px;width:52px;border:0;border-radius:12px;color:#fff;font-size:20px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 6px 14px -8px rgba(79,70,229,.8)}
  .search .clr{position:absolute;right:64px;top:10px;border:0;background:none;font-size:17px;color:var(--muted);padding:4px 8px}

  /* leitor de QR */
  .scan{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
  .scan video{flex:1;width:100%;object-fit:cover;min-height:0}
  .scan .frame{position:absolute;left:50%;top:42%;width:66vmin;height:66vmin;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.85);border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .scan .frame i{position:absolute;left:8%;right:8%;top:50%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#a78bfa,#60a5fa,transparent);box-shadow:0 0 12px #818cf8;animation:scl 1.6s ease-in-out infinite alternate}
  @keyframes scl{from{top:12%}to{top:88%}}
  .scan .bar{position:relative;z-index:2;background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .scan .bar .msg{flex:1 1 100%;font-weight:600;font-size:14px;text-align:center}
  .scan .bar .btn{flex:1}
  .scan .nocam{flex:1;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;font-size:15px}

  /* avisos, carregando, janelas */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;max-width:92vw;z-index:50;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);animation:tin .22s ease-out}
  .toast.bad{background:linear-gradient(135deg,#e11d48,#dc2626)}
  @keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  .busy{position:fixed;inset:0;background:rgba(244,246,251,.55);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:40}
  .spin{width:42px;height:42px;border-radius:50%;border:3.5px solid rgba(79,70,229,.15);border-top-color:var(--pri);border-right-color:var(--pri2);animation:sp .75s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:grid;place-items:end center;z-index:45;padding:14px;animation:fin .18s ease-out}
  .modal .card{width:100%;max-width:520px;margin:0 0 env(safe-area-inset-bottom);border-radius:24px;padding:22px 18px 18px;box-shadow:var(--sh2);animation:up .22s ease-out}
  .modal .card::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#d7dce6;margin:-8px auto 14px}
  @keyframes fin{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .late{color:var(--bad);font-weight:700}
  .fichas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .fbtn{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;text-align:left;border:1px solid var(--line2);background:linear-gradient(180deg,#fff,#f7f8fd);border-radius:14px;padding:10px 12px;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .fbtn span{font-size:20px}.fbtn b{font-size:14px;white-space:nowrap}.fbtn small{display:block;flex:1;min-width:0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fbtn:active{transform:scale(.98)}
  .fview{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;animation:fin .18s ease-out}
  .fview .fbar{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(135deg,#1e1b4b,#312e81 55%,#4c1d95);box-shadow:0 10px 30px -14px rgba(30,27,75,.7)}
  .fview .fbar .btn{flex:1}.fview .fbar .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.22)}
  .fview .fbody{flex:1;overflow:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
  .fview .fdoc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);max-width:760px;margin:0 auto}
  @media print{body.printing-ficha #app,body.printing-ficha .fbar,body.printing-ficha .toast{display:none!important}body.printing-ficha .fview{position:static;background:#fff}body.printing-ficha .fview .fdoc{border:0;box-shadow:none;padding:0}}
  .fdoc{font:13px/1.4 Inter,Arial,sans-serif;color:#0b1220}.fdoc .fh{border-bottom:2px solid #0b1220;padding-bottom:8px;margin-bottom:10px}.fdoc .fb{font-size:11px;font-weight:700;color:#4f46e5;text-transform:uppercase;letter-spacing:.5px}.fdoc h2{margin:2px 0 4px;font-size:20px}.fdoc h3{font-size:14px;margin:16px 0 6px}.fdoc h3 small{font-weight:500;color:#6b7a90}.fdoc .sub{color:#6b7a90;font-size:12px}.fdoc .fphotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.fdoc figure{margin:0;border:1px solid #e3e7ef;border-radius:12px;overflow:hidden;text-align:center;background:#fafbfe}.fdoc figure img{width:100%;max-height:260px;object-fit:contain;display:block}.fdoc .nof{padding:40px 0;color:#9aa6b8}.fdoc figcaption{font-size:11px;color:#6b7a90;padding:4px}.fdoc .fkpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.fdoc .fkpis div{border:1px solid #e3e7ef;border-radius:10px;padding:8px;text-align:center}.fdoc .fkpis span{display:block;font-size:10px;color:#6b7a90;text-transform:uppercase;font-weight:600}.fdoc .fkpis b{font-size:15px}.fdoc table.ft{width:100%;border-collapse:collapse;font-size:12px}.fdoc .ft th{background:#f2f4fa;text-align:left;padding:6px;font-size:10.5px;text-transform:uppercase;color:#4b5568}.fdoc .ft td{padding:6px;border-bottom:1px solid #eceff5;vertical-align:top}.fdoc .ft tr.g td{background:#eef2ff;color:#3730a3;font-weight:700;font-size:11px}.fdoc .ft tfoot td{font-weight:800;border-top:2px solid #0b1220}.fdoc .r{text-align:right}.fdoc .c{text-align:center}.fdoc .e{text-align:center;color:#9aa6b8}.fdoc .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6b7a90}
  .hidden{display:none!important}
</style>
</head>

<script>
var S={token:'',perfil:null,tipo:'OPERADOR',data:null,open:{},q:'',timer:null,refresh:null};
function $(id){return document.getElementById(id)}

// v5: app de campo direto no Supabase. A empresa vem do link: /campo/<codigo-da-empresa>
var SUPA_URL='https://ipjsogzbdkqprrtuquok.supabase.co',SUPA_KEY='sb_publishable_jJqCSp5S2wOh0Pa5bQlVGg_cxJweXNy';
var EMPRESA=(function(){var p=location.pathname.split('/').filter(Boolean),i=p.indexOf('campo'),q=new URLSearchParams(location.search).get('e');return String(q||(i>=0&&p[i+1])||'').toLowerCase().replace(/[^a-z0-9-]/g,'')})();

var CAMPO_BASE=location.origin+(function(){var p=location.pathname,i=p.indexOf('/campo/');return i>=0?p.slice(0,i+7):p.replace(/[^/]*$/,'')})();
(function(){try{var nome='GUT Campo',m={name:nome,short_name:nome,start_url:location.origin+location.pathname+location.search,scope:CAMPO_BASE,display:'standalone',background_color:'#f4f6fb',theme_color:'#1e1b4b',icons:[{src:CAMPO_BASE+'icone.svg',sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]};

function ls(k,v){k=k+'@'+EMPRESA;try{if(v===undefined)return localStorage.getItem(k)||'';if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return ''}}
function toast(m,bad){var t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},bad?5000:3200)}
function busy(on){$('busy').classList.toggle('hidden',!on)}
function num(v){return Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:1})}
function dt(v,withTime){if(!v)return '—';var d=new Date(v);if(isNaN(d))return '—';return withTime?d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('pt-BR')}
var RPC={login:function(p){return ['campo_login',{p_empresa:EMPRESA,p_tipo:p.tipo,p_login:p.login,p_senha:p.senha}]},

    if(res.error){var msg=res.error.message||'Erro';if(/sess[aã]o expirou/i.test(msg)&&action!=='login')logout(true);throw new Error(msg)}
    var r=res.data||{};if(r.error)throw new Error(r.error);

    '<div class="sub">'+num(h.operacoes)+' operações • '+num(h.pecas)+' peças'+(h.eficMarcacao!=null?' • eficiência nas marcações <b>'+num(h.eficMarcacao)+'%</b>':'')+'</div></div>';
  if(p.lider)html+='<div class="card lider"><div class="row"><b style="flex:1">👑 Líder — todo o setor</b></div><div class="acts"><button class="btn ghost" onclick="pausarTodos()">⏸ Pausar todos</button><button class="btn go" onclick="retomarTodos()">▶ Retomar todos</button></div><div class="sub" style="margin-top:6px">Fim do expediente: pause todos. No dia seguinte: retome todos.</div></div>';
  if(run)html+='<div class="card running"><div class="row"><span class="chip info">⏱ Em andamento</span><span class="sp" style="flex:1"></span><span class="timer" id="tmr">'+clock(run)+'</span></div>'+opInfo(run)+'<div class="acts"><button class="btn ghost" onclick="pausar(\''+run.ID_CUPOM+'\')">⏸ Pausar</button><button class="btn stop" onclick="finalizar(\''+run.ID_CUPOM+'\')">■ Finalizar</button></div></div>';
  paused.forEach(function(c){html+='<div class="card paused"><div class="row"><span class="chip warn">⏸ Pausado'+(c.PAUSA_TIPO==='COLETIVA'?' (todos)':'')+'</span><span class="sp" style="flex:1"></span><span class="timer small">'+clock(c)+'</span></div>'+opInfo(c)+'<div class="acts"><button class="btn go" onclick="retomar(\''+c.ID_CUPOM+'\')">▶ Retomar</button><button class="btn stop" onclick="finalizar(\''+c.ID_CUPOM+'\')">■ Finalizar</button></div></div>'});
  html+='<div class="search" style="margin-top:12px"><span>🔎</span><input id="q" value="'+esc(S.q)+'" placeholder="Buscar ou bipar cupom / caixa" autocapitalize="characters">'+(S.q?'<button class="clr" onclick="S.q=\'\';renderOperador()" title="Limpar">✕</button>':'')+'<button class="cam" onclick="openScanner()" title="Ler QR Code com a câmera">📷</button></div>';
  if(!list.length)html+='<div class="card empty">'+(q?'Nenhuma operação encontrada para “'+esc(S.q)+'”.':'Nenhuma operação alocada para você agora. Peça ao responsável para alocar no sistema.')+'</div>';
  list.slice(0,80).forEach(function(c){var b=[];
    if(modo!=='APONTADOR')b.push('<button class="btn go" onclick="iniciar(\''+c.ID_CUPOM+'\')">▶ Iniciar</button>');
    if(modo!=='MARCADOR')b.push('<button class="btn ok" '+(c.SEM_PADRAO?'disabled title="Sem tempo padrão: use Iniciar/Finalizar"':'')+' onclick="apontar(\''+c.ID_CUPOM+'\')">✓ Concluir</button>');
    html+='<div class="card op'+(c.ALOCADO?' mine':'')+(c.SEM_PADRAO?' nostd':'')+'">'+opInfo(c)+'<div class="acts">'+b.join('')+'</div></div>'});
  if(list.length>80)html+='<p class="sub" style="text-align:center">Mostrando 80 de '+list.length+'. Use a busca para achar outras.</p>';
  $('app').innerHTML=html+'</div>';
  var qi=$('q');qi.oninput=function(){S.q=qi.value;var pos=qi.selectionStart;renderOperador();var n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  qi.onkeydown=function(e){if(e.key==='Enter')useCode(qi.value)};
  if(S.timer)clearInterval(S.timer);S.timer=run?setInterval(function(){var t=$('tmr');if(t)t.textContent=clock(run)},1000):null}
function opInfo(c){return '<div class="row"><p class="ttl" style="flex:1">'+(c.ORDEM?'<span class="ord">'+String(c.ORDEM).padStart(2,'0')+'</span>':'')+esc(c.PROCESSO)+'</p>'+(c.ALOCADO?'<span class="chip warn">para você</span>':'')+(c.SEM_PADRAO?'<span class="chip bad">cronometrar</span>':'')+'</div>'+
  '<div class="sub">'+esc(c.PRODUTO)+' • '+esc([c.COR,c.TAMANHO].filter(Boolean).join(' / '))+' • <b>'+num(c.QTD)+' pç</b>'+(c.SEM_PADRAO?'':' • '+num(c.MIN_PADRAO)+' min')+'<br>Caixa <b>'+esc(c.CAIXA)+'</b>'+(c.MAQUINA?' • ⚙ '+esc(c.MAQUINA):'')+'</div>'}

// ---------- leitor de QR (câmera) ----------
// Tenta a câmera ao vivo; se o navegador não deixar, abre a câmera do celular para tirar uma foto do QR.
var SCN={stream:null,raf:null,det:null,busy:false};
function useCode(raw){var v=String(raw||'').trim(),V=v.toUpperCase(),d=S.data||{},cs=d.cupons||[],modo=modoAtual(),run=cs.find(function(c){return c.EM_ANDAMENTO});if(!v)return;
  var hit=cs.find(function(c){return (c.CODIGO||'').toUpperCase()===V||(c.TOKEN&&c.TOKEN.toUpperCase()===V)});
  if(hit){S.q='';renderOperador();if(hit.EM_ANDAMENTO){finalizar(hit.ID_CUPOM);return}if(hit.PAUSADO){retomar(hit.ID_CUPOM);return}if(modo==='APONTADOR')apontar(hit.ID_CUPOM);else iniciar(hit.ID_CUPOM);return}
  var naCaixa=cs.filter(function(c){return (c.CAIXA||'').toUpperCase()===V||(c.CODIGO||'').toUpperCase().indexOf(V)===0});
  S.q=v;renderOperador();
  if(naCaixa.length)toast('Caixa '+v+': '+naCaixa.length+' operação(ões) para você.');else toast('Código '+v+': nenhuma operação sua com este código.',true)}
function loadJsQR(){return window.jsQR?Promise.resolve(window.jsQR):new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=function(){window.jsQR?res(window.jsQR):rej(new Error('leitor indisponível'))};s.onerror=function(){rej(new Error('Sem internet para carregar o leitor de QR.'))};document.head.appendChild(s)})}
function getDetector(){if(SCN.det!==null)return Promise.resolve(SCN.det);if(!('BarcodeDetector' in window)){SCN.det=false;return Promise.resolve(false)}
  return Promise.resolve(BarcodeDetector.getSupportedFormats?BarcodeDetector.getSupportedFormats():['qr_code']).then(function(f){SCN.det=f.indexOf('qr_code')>=0?new BarcodeDetector({formats:['qr_code']}):false;return SCN.det}).catch(function(){SCN.det=false;return false})}
function decodeFrom(src,w,h){return getDetector().then(function(det){if(det)return det.detect(src).then(function(r){return r&&r[0]?r[0].rawValue:''}).catch(function(){return ''});
  return loadJsQR().then(function(jsQR){var c=decodeFrom.c||(decodeFrom.c=document.createElement('canvas')),k=Math.min(1,800/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,c.width,c.height);var im=x.getImageData(0,0,c.width,c.height),r=jsQR(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});return r?r.data:''})})}
function scanUI(inner){closeScanner(true);var m=document.createElement('div');m.className='scan';m.id='scanBox';m.innerHTML=inner+'<div class="bar"><div class="msg" id="scanMsg">Aponte para o QR Code do cupom ou da caixa</div><button class="btn ghost" onclick="scanPhoto()">📸 Tirar foto</button><button class="btn stop" onclick="closeScanner()">Fechar</button></div>';document.body.appendChild(m);return m}
function openScanner(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){scanPhoto();return}
  var m=scanUI('<video id="scanVid" playsinline muted autoplay></video><div class="frame"><i></i></div>');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(st){
    if(!document.getElementById('scanBox')){st.getTracks().forEach(function(t){t.stop()});return}
    SCN.stream=st;var v=$('scanVid');v.srcObject=st;v.play().catch(function(){});getDetector();if(!('BarcodeDetector' in window))loadJsQR().catch(function(){});scanLoop()
  }).catch(function(e){var msg=$('scanMsg');m.querySelector('video').outerHTML='<div class="nocam">📷<br><br>Não foi possível abrir a câmera ao vivo aqui'+(e&&e.name==='NotAllowedError'?' (permissão negada)':'')+'.<br>Use <b>📸 Tirar foto</b>: o celular abre a câmera, você fotografa o QR e o app lê.</div>';var f=m.querySelector('.frame');if(f)f.remove();if(msg)msg.textContent='Câmera ao vivo indisponível — use a foto'})}
function scanLoop(){var v=$('scanVid');if(!v||!SCN.stream)return;
  if(!SCN.busy&&v.readyState>=2&&v.videoWidth){SCN.busy=true;decodeFrom(v,v.videoWidth,v.videoHeight).then(function(code){SCN.busy=false;if(code&&SCN.stream){if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){}closeScanner();useCode(code)}}).catch(function(){SCN.busy=false})}
  SCN.raf=setTimeout(scanLoop,220)}
function closeScanner(keepUI){if(SCN.raf)clearTimeout(SCN.raf);SCN.raf=null;if(SCN.stream){SCN.stream.getTracks().forEach(function(t){t.stop()});SCN.stream=null}var b=document.getElementById('scanBox');if(b&&!keepUI)b.remove();else if(b&&keepUI)b.remove()}
function scanPhoto(){var i=document.createElement('input');i.type='file';i.accept='image/'+'*';i.setAttribute('capture','environment');i.style.display='none';document.body.appendChild(i);
  i.onchange=function(){var f=i.files&&i.files[0];i.remove();if(!f)return;closeScanner();busy(true);var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){decodeFrom(img,img.naturalWidth,img.naturalHeight).then(function(code){URL.revokeObjectURL(url);busy(false);if(code)useCode(code);else toast('Não achei um QR Code na foto. Tente de novo, mais perto e com luz.',true)}).catch(function(e){busy(false);toast(e.message,true)})};
    img.onerror=function(){busy(false);toast('Não consegui abrir a foto.',true)};img.src=url};
  i.click()}
function findOp(id){return ((S.data&&S.data.cupons)||[]).find(function(c){return c.ID_CUPOM===id})||{}}
function runningOp(){return ((S.data&&S.data.cupons)||[]).find(function(c){return c.EM_ANDAMENTO})}
function iniciar(id){var c=findOp(id),run=runningOp();var go=function(pausar){busy(true);call('opIniciar',{ID_CUPOM:id,PAUSAR_OUTRA:!!pausar}).then(function(r){toast((pausar?'⏸ '+(run.PROCESSO||'')+' pausada • ':'')+'Iniciado: '+(c.PROCESSO||'operação')+' ⏱');return load(false)}).catch(function(e){toast(e.message,true);load(false)}).then(function(){busy(false)})};
  if(run&&run.ID_CUPOM!==id)return confirmBox('Pausar a atual e iniciar esta?','Você está em '+(run.PROCESSO||'outra operação')+' (caixa '+(run.CAIXA||'')+'). Ela fica pausada — o tempo para de contar — e começa '+(c.PROCESSO||'esta')+'.','⏸ Pausar e ▶ iniciar','go').then(function(ok){if(ok)go(true)});go(false)}
function pausar(id){var c=findOp(id);busy(true);call('opPausar',{ID_CUPOM:id}).then(function(){toast('⏸ Pausado: '+(c.PROCESSO||'operação')+'. O tempo parou.');return load(false)}).catch(function(e){toast(e.message,true);load(false)}).then(function(){busy(false)})}
function retomar(id){var c=findOp(id),run=runningOp();var go=function(){busy(true);call('opRetomar',{ID_CUPOM:id}).then(function(){toast('▶ Retomado: '+(c.PROCESSO||'operação'));return load(false)}).catch(function(e){toast(e.message,true);load(false)}).then(function(){busy(false)})};
  if(run&&run.ID_CUPOM!==id)return confirmBox('Retomar esta operação?',(run.PROCESSO||'A atual')+' fica pausada e '+(c.PROCESSO||'esta')+' volta a contar.','▶ Retomar','go').then(function(ok){if(ok)go()});go()}
function pausarTodos(){confirmBox('Pausar todo mundo?','Todas as marcações em andamento param de contar tempo. Use no fim do expediente.','⏸ Pausar todos','stop').then(function(ok){if(!ok)return;busy(true);call('opPausarTodos',{}).then(function(r){toast('⏸ '+r.qtd+' marcação(ões) pausada(s).');return load(false)}).catch(function(e){toast(e.message,true)}).then(function(){busy(false)})})}
function retomarTodos(){confirmBox('Retomar todo mundo?','Voltam a contar as marcações da pausa coletiva. As que alguém pausou sozinho continuam pausadas.','▶ Retomar todos','go').then(function(ok){if(!ok)return;busy(true);call('opRetomarTodos',{}).then(function(r){toast('▶ '+r.qtd+' marcação(ões) retomada(s).');return load(false)}).catch(function(e){toast(e.message,true)}).then(function(){busy(false)})})}
function finalizar(id){var c=findOp(id);confirmBox('Finalizar a operação?',(c.PROCESSO||'')+' • caixa '+(c.CAIXA||''),'■ Finalizar','stop').then(function(ok){if(!ok)return;busy(true);
  call('opFinalizar',{ID_CUPOM:id}).then(function(r){toast('Finalizado ✓'+(r.eficiencia!==''&&r.eficiencia!=null?' • eficiência '+num(r.eficiencia)+'%':''));return load(false)}).catch(function(e){toast(e.message,true);load(false)}).then(function(){busy(false)})})}
function apontar(id){var c=findOp(id);confirmBox('Concluir esta operação?',(c.PROCESSO||'')+' • '+num(c.QTD)+' pç • caixa '+(c.CAIXA||''),'✓ Concluir','ok').then(function(ok){if(!ok)return;busy(true);
  call('opApontar',{ID_CUPOM:id}).then(function(){toast('Concluído ✓');return load(false)}).catch(function(e){toast(e.message,true);load(false)}).then(function(){busy(false)})})}

// ---------- início ----------
(function(){if(!EMPRESA){$('app').innerHTML='<div class="wrap"><div class="card login"><h2>Link incompleto</h2><p class="sub">Este endereço não tem o código da empresa. Peça ao responsável o link do app (ele termina com /campo/código-da-empresa).</p></div></div>';return}
  S.tipo=ls('gutCampoTipo')||'OPERADOR';S.token=ls('gutCampoToken');S.empresaId=ls('gutCampoEmp');if(S.token)aoVivo();
  sb.rpc('campo_empresa',{p_empresa:EMPRESA}).then(function(r){var d=r.data||{};S.empresaNome=d.nome||'';if(!d.ok){S.token='';ls('gutCampoToken',null);$('app').innerHTML='<div class="wrap"><div class="card login"><h2>Empresa não encontrada</h2><p class="sub">Confira o link do app com o responsável.</p></div></div>';return}document.title=(d.nome?d.nome+' • ':'')+'GUT Campo';var h=document.querySelector('.login .hint');if(h&&d.nome)h.textContent=d.nome+' — entre com o seu usuário e senha.'});
  if(!S.token)return renderLogin();
  var c=cached();if(c){S.perfil=c.perfil;S.data=c.data;render();start();return}
  busy(true);call('perfil',{}).then(function(r){S.perfil=r.perfil;start()}).catch(function(){S.token='';ls('gutCampoToken',null);renderLogin()}).then(function(){busy(false)})})();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.perfil)load(false)});
</script>
